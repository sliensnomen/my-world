<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界仓库</title>
<style>
  :root { --red: #b3261e; --yellow: #8a6d00; --green: #1e7b34; --gray: #666; --bg: #fafafa; --line: #ddd; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: var(--bg); color: #222; }
  header { padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { color: var(--gray); font-size: 13px; }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button { border: 1px solid var(--line); background: #fff; padding: 4px 12px; cursor: pointer; border-radius: 4px; font-size: 14px; }
  nav button.active { background: #333; color: #fff; }
  main { padding: 16px; max-width: 960px; margin: 0 auto; }
  .badge { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 12px; margin-right: 4px; }
  .badge.error { background: #fbe4e2; color: var(--red); }
  .badge.warning { background: #fdf3d7; color: var(--yellow); }
  .badge.info { background: #e4effb; color: #1a5fa8; }
  .badge.type { background: #eee; color: var(--gray); }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--gray); }
  .findings-col { white-space: nowrap; }
  details { background: #fff; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; }
  summary { padding: 8px 12px; cursor: pointer; }
  details .body { padding: 0 12px 12px; }
  pre { background: #f4f4f4; padding: 8px; overflow-x: auto; font-size: 12px; border-radius: 4px; }
  .filters { margin-bottom: 8px; font-size: 14px; color: var(--gray); }
  .filters a { color: #1a5fa8; cursor: pointer; margin-right: 8px; text-decoration: none; }
  .filters a.active { font-weight: bold; }
  .muted { color: var(--gray); }
  .empty { color: var(--gray); padding: 24px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>世界仓库</h1>
  <span class="meta" id="meta">加载中…</span>
  <nav>
    <button data-view="entries" class="active">台账</button>
    <button data-view="findings">审计</button>
    <button data-view="ledger">流水</button>
    <button data-view="tickets">工单</button>
    <button data-view="event" id="nav-event" hidden>记账</button>
  </nav>
</header>
<main id="main"></main>
<script>
let WORLD = null, HEALTH = null;
const REQUIRED_FALLBACK = {"transfer":["by","to","object"],"custody":["by","to","object"],"grant":["by","to","object"],"move":["object","to"],"create":["object"],"destroy":["object"],"birth":["object"],"death":["object"],"join":["by","to"],"leave":["by","from"],"transform":["object","result"]};
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 写接口可能挂 --token：从 sessionStorage 取，401 时问一次再重发；读接口不受影响。
function authHeaders() {
  const t = sessionStorage.getItem("wgp-token");
  return t ? {Authorization: "Bearer " + t} : {};
}
async function postJSON(path, payload) {
  const send = () => fetch(path, {method: "POST",
    headers: {"Content-Type": "application/json", ...authHeaders()},
    body: JSON.stringify(payload)});
  let res = await send();
  if (res.status === 401) {
    const t = prompt("这个写接口要 token（服务端 --token 设置的那个）：");
    if (t && t.trim()) {
      sessionStorage.setItem("wgp-token", t.trim());
      res = await send();
    }
  }
  return res;
}

async function boot() {
  const res = await fetch("/api/world");
  WORLD = await res.json();
  try { HEALTH = await (await fetch("/api/health")).json(); } catch (e) { HEALTH = null; }
  if (HEALTH && HEALTH.writable) $("#nav-event").hidden = false;
  const c = WORLD.counts;
  $("#meta").textContent =
    `${c.entries} 条目 | ${c.errors} 错误 | ${c.warnings} 警告 | 协议 ${WORLD.protocol_version} / 契约 ${WORLD.contract_version}`;
  document.querySelectorAll("nav button").forEach(b =>
    b.addEventListener("click", () => {
      document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      render(b.dataset.view);
    }));
  render("entries");
}

function findingsByEntry() {
  const map = {};
  for (const f of WORLD.findings) {
    const key = f.entry.split(" ↔ ")[0];
    (map[key] ||= []).push(f);
  }
  return map;
}

function renderEntries(filter) {
  const fmap = findingsByEntry();
  const entries = WORLD.entries.filter(e =>
    !filter || e.type === filter || e.status === filter);
  const types = [...new Set(WORLD.entries.map(e => e.type).filter(Boolean))].sort();
  let html = `<div class="filters">筛选：<a data-f="" class="${!filter?'active':''}">全部</a>` +
    types.map(t => `<a data-f="${esc(t)}" class="${filter===t?'active':''}">${esc(t)}</a>`).join("") + `</div>`;
  html += `<table><tr><th>id</th><th>类型/状态</th><th>标题</th><th>审计</th></tr>`;
  for (const e of entries) {
    const fs = (fmap[e.path] || []).map(f =>
      `<span class="badge ${f.level}">${f.rule}</span>`).join("");
    const badges = e.parse_error ? `<span class="badge error">读不出</span>` : fs;
    html += `<tr><td><code>${esc(e.id)}</code></td>
      <td class="findings-col"><span class="badge type">${esc(e.type)}</span><span class="badge type">${esc(e.status)}</span>${e.load_bearing?'<span class="badge warning">承重</span>':''}</td>
      <td><a href="/api/entry/${encodeURIComponent(e.id)}">${esc(e.title)}</a><br><span class="muted">${esc(e.body_excerpt||"").slice(0,60)}…</span></td>
      <td class="findings-col">${badges}</td></tr>`;
  }
  html += "</table>";
  $("#main").innerHTML = html;
  document.querySelectorAll(".filters a").forEach(a =>
    a.addEventListener("click", () => renderEntries(a.dataset.f || null)));
}

function renderFindings() {
  const groups = {};
  for (const f of WORLD.findings) (groups[f.rule] ||= []).push(f);
  let html = "";
  for (const rule of Object.keys(groups).sort()) {
    const fs = groups[rule];
    html += `<details open><summary><span class="badge ${fs[0].level}">${rule}</span> ${fs.length} 条</summary><div class="body"><table>`;
    for (const f of fs) html += `<tr><td><code>${esc(f.entry)}</code></td><td>${esc(f.message)}</td></tr>`;
    html += "</table></div></details>";
  }
  $("#main").innerHTML = html || `<div class="empty">零 findings——这个世界全绿。</div>`;
}

function renderLedger() {
  const L = WORLD.ledger || {states: {}, membership: {}};
  const objs = Object.keys(L.states);
  const persons = Object.keys(L.membership);
  let html = "<h3>派生状态（期初断言 + 流水）</h3>";
  if (!objs.length) html += `<div class="empty">没有可派生的客体。</div>`;
  else {
    html += `<table><tr><th>客体</th><th>持有者</th><th>保管</th><th>位置</th></tr>`;
    for (const o of objs) {
      const s = L.states[o];
      const src = s.holder_source ? `<span class="muted">（来自 ${esc(s.holder_source)}）</span>` : "";
      html += `<tr><td><code>${esc(o)}</code></td><td>${esc(s.holder || "（无）")}${src}</td><td>${esc(s.custodian || "-")}</td><td>${esc(s.location || "-")}</td></tr>`;
    }
    html += "</table>";
  }
  html += "<h3>组织归属（join/leave 流水）</h3>";
  if (!persons.length) html += `<div class="empty">没有 join/leave 流水。</div>`;
  else {
    html += "<table><tr><th>人</th><th>归属</th></tr>";
    for (const p of persons) {
      const acts = L.membership[p];
      const txt = Object.entries(acts).map(([o, a]) => `${a === "join" ? "在" : "已离开"} ${o}`).join("；");
      html += `<tr><td><code>${esc(p)}</code></td><td>${esc(txt)}</td></tr>`;
    }
    html += "</table>";
  }
  $("#main").innerHTML = html;
}

function renderEventForm() {
  const legs = (HEALTH && HEALTH.required_legs) || REQUIRED_FALLBACK;
  const kinds = Object.keys(legs).sort();
  let html = `<h3>记一笔流水</h3>
  <table style="max-width:640px">
    <tr><td>种类</td><td><select id="f-kind">${kinds.map(k=>`<option>${k}</option>`).join("")}</select></td></tr>
    <tr><td>id（可空，自动起名）</td><td><input id="f-id" placeholder="ev-例：ev-sword-01"></td></tr>
    <tr><td>标题（可空）</td><td><input id="f-title"></td></tr>
    <tr><td>时间（故事内，自由文本）</td><td><input id="f-when" placeholder="例：第三纪 245 年"></td></tr>
    <tr><td>排序键（数字，可空）</td><td><input id="f-when-sort" type="number"></td></tr>
  </table>
  <div id="f-legs"></div>
  <p><button id="f-submit" style="padding:6px 20px">提交</button>
  <span id="f-msg" style="margin-left:8px"></span></p>
  <div id="f-findings"></div>`;
  $("#main").innerHTML = html;
  const drawLegs = () => {
    const kind = $("#f-kind").value;
    const req = legs[kind] || [];
    const opt = ["by","to","object","from","result"].filter(l => !req.includes(l));
    $("#f-legs").innerHTML = `<table style="max-width:640px">` +
      req.map(l => `<tr><td><b>${l}</b>（必填）</td><td><input data-leg="${l}" placeholder="id，多个用逗号隔开"></td></tr>`).join("") +
      opt.map(l => `<tr><td>${l}（可选）</td><td><input data-leg="${l}" placeholder="id，多个用逗号隔开"></td></tr>`).join("") +
      `</table>`;
  };
  $("#f-kind").addEventListener("change", drawLegs);
  drawLegs();
  $("#f-submit").addEventListener("click", async () => {
    const payload = {event_kind: $("#f-kind").value};
    if ($("#f-id").value.trim()) payload.id = $("#f-id").value.trim();
    if ($("#f-title").value.trim()) payload.title = $("#f-title").value.trim();
    if ($("#f-when").value.trim()) payload.when = $("#f-when").value.trim();
    if ($("#f-when-sort").value !== "") payload.when_sort = Number($("#f-when-sort").value);
    document.querySelectorAll("[data-leg]").forEach(inp => {
      const ids = inp.value.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean);
      if (ids.length) payload[inp.dataset.leg] = ids;
    });
    const res = await postJSON("/api/event", payload);
    const data = await res.json().catch(() => ({}));
    if (res.status === 201) {
      $("#f-msg").innerHTML = `<span style="color:var(--green)">记上了：${esc(data.id)}（审计通过）</span>`;
      $("#f-findings").innerHTML = "";
      WORLD = await (await fetch("/api/world")).json();
      const c = WORLD.counts;
      $("#meta").textContent = `${c.entries} 条目 | ${c.errors} 错误 | ${c.warnings} 警告 | 协议 ${WORLD.protocol_version} / 契约 ${WORLD.contract_version}`;
    } else {
      $("#f-msg").innerHTML = `<span style="color:var(--red)">${esc(data.error || ("HTTP " + res.status))}</span>`;
      $("#f-findings").innerHTML = (data.findings || []).map(f =>
        `<p><span class="badge ${f.level}">${f.rule}</span> ${esc(f.message)}</p>`).join("");
    }
  });
}

function renderTickets() {
  // 仲裁工单：断言互搏与「结论和流水打架」自动生成（宪章第五条的客观兜底）
  const RULES = ["CA704", "CA707", "CA709", "CA710", "CA712"];
  const fs = WORLD.findings.filter(f => RULES.includes(f.rule));
  const statusOf = {};
  for (const e of WORLD.entries) if (e.id) statusOf[e.id] = e.status;
  const idOf = (path) => {
    const e = WORLD.entries.find(x => x.path === path);
    return e ? e.id : null;
  };
  let html = `<h3>仲裁工单（互搏与对账不一致）</h3>`;
  if (!fs.length) html += `<div class="empty">没有待仲裁的矛盾。</div>`;
  else {
    html += `<table><tr><th>规则</th><th>条目</th><th>问题</th><th>处置</th></tr>`;
    for (const f of fs) {
      const id = idOf(f.entry);
      const st = statusOf[id] || "";
      const next = {draft: "trial", trial: "canon"}[st];
      let actions = "";
      if (HEALTH && HEALTH.writable && id) {
        if (next) actions += `<button data-act="status" data-id="${esc(id)}" data-st="${next}">升 ${next}</button> `;
        actions += `<button data-act="archive" data-id="${esc(id)}">降级…</button>`;
      }
      html += `<tr><td><span class="badge ${f.level}">${f.rule}</span></td>
        <td><code>${esc(f.entry)}</code><br><span class="muted">${esc(st)}</span></td>
        <td>${esc(f.message)}</td><td class="findings-col">${actions}</td></tr>`;
    }
    html += "</table>";
  }
  html += `<p class="muted">治理纪律：升格/降级与写卡同一条路——写完即审，红则回滚；
  降级必须给承接者（superseded_by），上诉窗口 72 小时按 git 最后一次提交计。</p>
  <div id="f-msg"></div>`;
  $("#main").innerHTML = html;
  document.querySelectorAll("[data-act]").forEach(btn =>
    btn.addEventListener("click", async () => {
      const payload = {id: btn.dataset.id};
      if (btn.dataset.act === "status") payload.status = btn.dataset.st;
      else {
        const succ = prompt(`降级 ${btn.dataset.id}：承接条目 id（留空 = 显式无承接者，superseded_by: null）`);
        if (succ === null) return;
        payload.status = "archived";
        payload.superseded_by = succ.trim() || null;
      }
      const res = await postJSON("/api/status", payload);
      const data = await res.json().catch(() => ({}));
      if (res.status === 200) {
        WORLD = await (await fetch("/api/world")).json();
        // 先重绘再写提示：重绘会替换 #main（提示节点在它里面），顺序反了就只剩空节点
        renderTickets();
        $("#f-msg").innerHTML = `<span style="color:var(--green)">已更新 ${esc(payload.id)}</span>`;
      } else {
        $("#f-msg").innerHTML = `<span style="color:var(--red)">${esc(data.error || ("HTTP " + res.status))}</span>` +
          (data.findings || []).map(f => `<p><span class="badge ${f.level}">${f.rule}</span> ${esc(f.message)}</p>`).join("");
      }
    }));
}

function render(view) {
  if (view === "entries") renderEntries(null);
  else if (view === "findings") renderFindings();
  else if (view === "ledger") renderLedger();
  else if (view === "tickets") renderTickets();
  else if (view === "event") renderEventForm();
}

boot().catch(e => { $("#main").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; });
</script>
</body>
</html>
