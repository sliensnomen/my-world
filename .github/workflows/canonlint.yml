# 项目 CI：跑测试，而不是拿工具自己的仓库当审计对象。
#
# 为什么不再对仓库根跑 `canonlint . --strict`：
# 这个仓库里没有 entries/ canon/ sandbox/ archive/ 任何一个入口目录，canonlint
# 会退化成扫描整个仓库（store/layout.py 里 collect 的 fallback），把测试夹具当成
# 待审计的世界——744 个错误，没有一条是真的。审计对象是「世界数据」，不是「工具源码」。
# 那条命令一次也没能拦住任何东西：它只出现在最初的 workflow 版本（f7ffdd4，
# `on: [pull_request]`）里，而那个版本**一次都没被触发过**（带它的运行记录 0 条）。
# 旧注释写「本仓库从来没有 PR」是错的——`Merge pull request #4`–`#7` 就在 git log 里；
# 错的是「之前没有 PR」，不是「这条命令有多余」。
#
# 世界数据仓库该跑什么（本仓库的 CI 是它自己的测试，不是它的模板）：
#   python3 canonlint.py . --strict                     # error 与 warning 都拦
#   python3 canonlint.py . --json --impact <条目 id>     # CA504 只读报告
# --impact 的报告级别是 report，不参与退出码（见 tests/run_tests.py 的不变量）。
name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  canonlint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml
      # test_serve 里有「wgp-client.js 在 node 下行为正确」一项；不给 node 的话
      # 那一项会被跳过。test_serve 现在会在跳过时把退出码弄红（除非显式设
      # CANONLINT_ALLOW_SKIP=1），所以这里必须真的把 node 装上。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 每条命令都跑两个后端；不增加 matrix 维度，保留分支保护依赖的四个检查名。
      - name: canonlint 夹具回归（registry + legacy：逐字节快照 + 崩溃守卫 + CA504 只读性）
        run: for backend in registry legacy; do WGP_JUDGE_BACKEND=$backend python3 tests/run_tests.py || exit $?; done
      - name: 世界文件契约（registry + legacy：good 语料必须合规、坏样本必须判红、词表必须与代码一致）
        run: for backend in registry legacy; do WGP_JUDGE_BACKEND=$backend python3 tests/test_schema.py || exit $?; done
      - name: 存储层边界（registry + legacy：存储不认识理论、规范形与旧写法等价、写入路径可读回）
        run: for backend in registry legacy; do WGP_JUDGE_BACKEND=$backend python3 tests/test_store.py || exit $?; done
      - name: 接口与解析器（registry + legacy：接口数据 = CLI 导出、坏文件不崩、只读、不能穿越目录、JS 解析器）
        run: for backend in registry legacy; do WGP_JUDGE_BACKEND=$backend python3 tests/test_serve.py || exit $?; done
      - name: 文档一致性（registry + legacy：规则编号 / 数字 / 路径 / 命令 / 检查名必须与代码一致）
        run: for backend in registry legacy; do WGP_JUDGE_BACKEND=$backend python3 tests/test_docs.py || exit $?; done

  classlint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml
      - name: classlint 夹具回归（registry + legacy：钉死的期望值三元组）
        run: for backend in registry legacy; do WGP_JUDGE_BACKEND=$backend python3 classlint/tests/run_tests.py || exit $?; done
